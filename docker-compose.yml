# ============================================================
# AQP docker-compose 编排（P0 最小三服务）
# 使用：
#   1. cp .env.example .env       # 必须设置 REDIS_PASSWORD（与 Redis 容器 --requirepass 同源）
#   2. docker-compose config      # 校验（本机仅有独立 docker-compose，无 `docker compose` 插件）
#   3. docker-compose up -d --build
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: aqp-redis
    restart: unless-stopped
    # ⚠️ 密码取自根 .env 的 REDIS_PASSWORD（compose 会自动读取根 .env 做 ${} 插值）。
    #    未配置时直接报错退出，避免起出「无密码 Redis → 后端 AUTH 被拒 → 永久缓存降级」。
    #    注意：容器名与 run.md 的手工启动模式同名，两种模式二选一；
    #    若已存在手工容器，先 `docker rm -f aqp-redis` 再 up。
    command: ["redis-server", "--appendonly", "yes",
              "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请在根 .env 中配置}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "60", "100"]
    environment:
      # 仅用于健康检查取密码（插值在整份文件生效，上面的 :? 已负责必填校验）
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - aqp-redis-data:/data
    # 宿主开发模式（后端跑在宿主机 8000/8124）需要从 127.0.0.1 连入，因此发布端口；
    # 只绑回环、不暴露到局域网。全 compose 模式（aqp-api 容器内）走服务名 redis 直连，不受影响。
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 2s
      retries: 5

  aqp-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aqp-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # ---- 运行时环境（审计 P0-2：此前 compose **从不设置 ENV**，于是永远走 dev 分支，
      #      `validate_runtime_safety` 的 prod fail-fast 永不执行，只打 warning）----
      - ENV=prod
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 必须与 redis 服务的 --requirepass 同源（都来自根 .env），否则 AUTH 失败即降级
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请在根 .env 中配置}
      - TZ=Asia/Shanghai
      # ---- 生产安全闸门（缺任一项在 `docker-compose config` 阶段即报错，杜绝"默认凭据上线"）----
      # ADMIN_TOKEN 仅供运维直连（前端登录用用户名/密码换 JWT），生产必须是 ≥32 位强随机串
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN 未设置：生产环境必须提供 ≥32 位强随机串}
      # JWT 签名密钥；生产禁止由 ADMIN_TOKEN 派生，必须独立设置 ≥32 位随机串
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 未设置：生产环境必须独立设置 ≥32 位随机串}
      - ALLOW_ADMIN_TOKEN_LOGIN=false
      - ALLOW_REGISTRATION=false
      # 前端经 nginx 同源反代 /api（见 frontend/nginx.conf），浏览器不触发 CORS。
      # ⚠️ 必须显式给出对外地址：默认值是 5173 开发地址，而 prod 校验会**直接拒绝启动**；
      #    留空同样被拒（`not cors_origins_list` 也是问题项）。
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ./data:/app/data
      - ./backend/logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      # P1-43/DEP-10：与镜像内 `Dockerfile` 的 HEALTHCHECK **保持同一 URL**。
      # 此前 compose 用 `/health`（恒 200 的 liveness）覆盖镜像里的 `/health/ready`
      # ⇒ ① 镜像那条声明成了**死配置**；② 容器永远 healthy，即使 sqlite/DATA_ROOT
      # 检查失败也照常被判"健康"并接流量。`/health/ready` 现在未就绪时回 HTTP 503，
      # 于是这里的 `-f` 才真正生效。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: "1.5"

  aqp-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aqp-web
    restart: unless-stopped
    depends_on:
      aqp-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 256m
    cpus: "0.5"

volumes:
  aqp-redis-data:
    driver: local
