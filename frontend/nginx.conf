# AQP 前端 Nginx（容器内 /etc/nginx/conf.d/default.conf）
#
# ⚠️ 2026-09-30 上线前全检 P0-2 修复（超时链断裂）：
#   后端 core/timeout_guard.py 的预算为 默认 240s / strategy-run 660s / dag-rerun 330s，
#   而原 `proxy_read_timeout 180s` **短于全部三者** ⇒ `/backtest/strategy-run`（前端 600s）
#   与 `/ops/dag/rerun`（前端 300s）必然被网关**先砍**，且返回 Nginx HTML 而非统一信封。
#   现提到 700s（= 后端最长预算 660s + 40s 余量）。
#   设计原则：**Nginx 超时 > 后端预算 > 前端超时**，三层缺一不可。
#
# ⚠️ 2026-10-01 上线前全检 F7（API 限流）：
#   本文件是容器内 /etc/nginx/conf.d/default.conf（被主 nginx.conf 的 http 块
#   include），故 limit_req_zone 直接写在**本文件顶层**即 http 上下文，合法。
#   - /api/ 常规档 10r/s + burst 20 nodelay：正常页面并发（overview/quotes 多路
#     并发请求）不会触顶；超出即 429，防单来源刷爆后端；
#   - /api/v1/auth/login 单独 1r/s + burst 5：登录是暴力破解的靶点，后端虽有
#     进程内限速（10 次/5 分钟），网关层先行收敛最廉价；
#   - SSE 精确匹配 location（= /api/v1/notify/stream）不继承前缀 location 的
#     limit_req，长连接推送不受影响；/health*、/metrics 探针路径均未挂限流。
#   按 $binary_remote_addr 限（每来源 IP 独立桶），不按全局计。
limit_req_zone $binary_remote_addr zone=aqp_api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=aqp_login:1m  rate=1r/s;

server {
    listen       80;
    server_name  _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin" always;

    # 安全头（2026-10-04 上线前全检 P2-6）：API 侧（backend/app/main.py
    # _SECURITY_HEADERS）此前已下发 nosniff / frame-options 等，但**前端站点没有
    # CSP / HSTS**。这里补上，且指令**逐条按前端实际用法核对**，避免白屏。
    #
    # CSP 指令逐条理由（均已在前端源码/构建产物中核实）：
    #   default-src 'self'   —— 兜底：所有未单独声明的取数指令默认仅同源。
    #   script-src 'self'    —— 构建产物 dist/index.html 只加载同源
    #                           /assets/index-*.js（**无内联脚本**）；打包产物中
    #                           grep 无 `new Function` / `eval`（无需 'unsafe-eval'）。
    #   style-src 'self'     —— Tailwind 生产构建输出同源静态 CSS；React 的
    #                           `style={{}}` 走 CSSOM（element.style）赋值，CSP
    #                           不拦截；全仓无运行时 <style> 注入、index.html 无
    #                           `style=` 属性 ⇒ **不需要** 'unsafe-inline'。
    #   img-src 'self' data: —— 图表用 canvas（ECharts/Lightweight Charts）；
    #                           数据导出/预览可能用 data: 图片。blob: 仅用于
    #                           下载锚点（`URL.createObjectURL`），属导航而非 CSP
    #                           取数 sink，故无需在此声明 blob:。
    #   font-src 'self'      —— 无外链字体/CDN（grep fonts.googleapis/iconfont 0 命中），
    #                           字体随同源资源下发。
    #   connect-src 'self'   —— axios 与 EventSource(SSE) 均打同源 /api/v1/*
    #                           （apiBaseUrl 缺省为 ''）。⚠️ 若以 VITE_API_BASE 指向
    #                           **其它源**部署，必须把该源加入 connect-src，否则前端
    #                           请求会被拦。当前 nginx 反代模型下同源即可。
    #   object-src 'none'    —— 本应用不使用 <object>/<embed>/插件。
    #   base-uri 'self'      —— 防 <base> 标签劫持相对路径。
    #   frame-ancestors 'self' —— 防点击劫持，与上面的 X-Frame-Options SAMEORIGIN 同向。
    #   form-action 'self'   —— 防表单提交被劫持到外站（应用本身走 fetch）。
    #
    # HSTS：仅浏览器经 **HTTPS** 收到时才生效（本容器 listen 80，纯 HTTP 下浏览器
    #   会忽略它，故对本地/内网无害）。若生产在前置网关终止 TLS，请同时在网关侧
    #   下发 HSTS。max-age=31536000 (1 年) + includeSubDomains 与后端 prod 口径一致。
    #
    # ⚠️ nginx add_header 继承规则：**当前层级定义了 add_header，就不会继承上级**。
    #   本 server 块定义了安全头 ⇒ `location /`（SPA 文档）继承之，CSP 会作用在
    #   index.html 上（这才是 CSP 真正生效的地方）。而 `location /assets/` 自带
    #   `add_header Cache-Control` ⇒ 该 location **不会**继承这里的 CSP/HSTS —— 对
    #   静态 JS/CSS 而言无所谓（CSP 只对文档响应有意义）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体上限（2026-09-30 全检 F-13 的纵深防御）。
    # 后端**无任何上传端点**（全仓 grep `UploadFile` 0 命中），最大合法请求体是
    # backtest/strategy-run 的 optimize_params 配置（KB 量级）。
    # 说明：日志洪泛的真实修复在**应用层**（core/errors.py 剥离 `input`），
    # 本行只是把"单请求可携带的字节数"显式化，避免依赖 nginx 默认值这一隐式事实。
    # 如需放宽（出现 413），按实测请求体分布上调即可。
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        alias   /usr/share/nginx/html/assets/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API 反代到 aqp-api 容器
    location /api/ {
        # F7 限流（zone 定义见文件头）：常规档 10r/s burst 20 nodelay，
        # 溢出回 429（默认 503 语义不对——客户端并非"服务不可用"）。
        limit_req zone=aqp_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://aqp-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 必须 > 后端最长预算（strategy-run 660s），否则长任务被网关误杀（见文件头注释）
        proxy_read_timeout                 700s;
        proxy_connect_timeout              5s;
        proxy_buffering on;
    }

    # 登录端点单独更严（F7）：1r/s burst 5，防暴力破解（精确匹配优先于 /api/ 前缀）。
    # 其余 proxy_* 配置与 /api/ 完全一致，仅限流档位不同。
    location = /api/v1/auth/login {
        limit_req zone=aqp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://aqp-api:8000/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 700s;
        proxy_connect_timeout              5s;
        proxy_buffering on;
    }

    # SSE 长连接（通知中心）：必须**精确匹配**以覆盖上面的 `location /api/` 前缀规则
    # （nginx 精确匹配优先于前缀匹配）。
    # 两个必须项：`proxy_buffering off`（否则事件被缓冲、前端收不到实时推送）、
    # 足够长的 read timeout（后端 `_EXEMPT_PATHS` 对本路径不加任何超时，
    # 是一条 while True + 15s 心跳的长连接，正常语义就是"永不结束"）。
    location = /api/v1/notify/stream {
        proxy_pass         http://aqp-api:8000/api/v1/notify/stream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 监控与探针必须**真正反代到后端**（2026-09-30 全检发现）：
    # 原配置下 `/metrics`、`/health` 落 `location /` → `try_files` → 回 index.html 200
    # ⇒ Prometheus 抓到的是一页 HTML、外部健康检查恒"绿"，属**假绿**，
    # 且是"服务已被打满却零告警"这一可观测性盲区的根因之一。
    location = /metrics {
        proxy_pass  http://aqp-api:8000/metrics;
        access_log  off;
    }
    location = /health {
        proxy_pass  http://aqp-api:8000/health;
        access_log  off;
    }
    # 就绪/存活探针：容器内 healthcheck 直连 8000，此处供网关侧外部探针使用。
    location = /health/ready {
        proxy_pass  http://aqp-api:8000/health/ready;
        access_log  off;
    }
    location = /health/live {
        proxy_pass  http://aqp-api:8000/health/live;
        access_log  off;
    }

    # `/healthz`：前端容器 HEALTHCHECK 的探针路径（`frontend/Dockerfile:33`），
    # 且被 `tests/test_ci_gate_hygiene.py::test_frontend_healthcheck_target_exists_in_nginx`
    # 门禁锁定 —— 路径名**不可改**。
    # 但实现已从"nginx 硬编码 `return 200 "ok"`"改为**真实反代到后端存活探针**：
    # 原实现无论后端死活都回 ok ⇒ **恒真**假绿，是"服务被打满却零告警"的盲区之一
    # （2026-09-30 全检）。改后：后端不可达 ⇒ 502 ⇒ curl -f 失败 ⇒ 容器 unhealthy，
    # 探针语义与"这个容器到底能不能服务"一致。
    location = /healthz {
        proxy_pass  http://aqp-api:8000/health/live;
        access_log  off;
    }

    # SPA 路由兜底：刷新任何路径均回 index.html，不产生服务器 404
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
