# AQP CI：push / PR → pytest → mypy → ruff → style:check → frontend build
name: CI
on:
  push:
    # ⚠️ 本仓默认分支是 master（`git branch -a` 只有 master/origin/master）。
    # 原写法只有 main ⇒ **推送 master 时 CI 从不触发**，门禁形同不存在。
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt -q
        # ⚠️ 2026-09-30 全检修复：原为 `pip install -r backend/requirements.txt`，
        # 而 mypy / ruff **不在** requirements.txt 里 ⇒ 下面两步必然
        # `command not found`，**门禁从未真正运行过**（这解释了为何 5 处 F401 与
        # 2 处 mypy 错误能长期存在）。requirements-dev.txt 用 `-r requirements.txt`
        # 继承生产依赖，并额外固定 mypy / ruff 版本。
      - name: 依赖完整性门禁
        working-directory: backend
        # ⚠️ 2026-09-30 全检 B-1b 修复：本仓曾发生「未完成的 pip 事务」把 venv 留在
        # 半装状态（孤儿 openai 声明不存在的 httpx2/jiter、jsonpath 缺 dist-info、
        # 9 个包各有两套 dist-info 并存），而**所有测试依旧全绿** —— 这类损坏对
        # 测试不可见，只在运行时 import 到才炸。故在跑测试**之前**先卡一道纯环境门禁。
        # 三层：pip check（声明层）/ import 冒烟+符号探针（运行时层）/ dist-info 唯一性（元数据层）。
        run: python scripts/check_deps.py
      - name: Run admin bootstrap (CI only)
        working-directory: backend
        run: python scripts/create_admin.py citest citest123
      - name: pytest
        working-directory: backend
        env:
          SQLITE_URL: "sqlite+aiosqlite:///./data/sqlite/aqp_ci.db"
          DATA_ROOT: "./data/test_parquet"
          REDIS_ENABLED: "true"
          REDIS_HOST: "127.0.0.1"
        run: pytest -q --tb=short
      - name: mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
      - name: ruff
        working-directory: backend
        # 原为 `ruff check app/ --select F401,F811,E9`：只查 app/、只 3 条规则
        # ⇒ tests/ 与 scripts/ 的 27 处问题（含 scripts/alerter.py 的 F821
        # `Undefined name sys`，实测该脚本必然 NameError）在 CI 里**永远看不见**。
        # 现按本轮已清零的范围与规则集收口（实测 All checks passed）。
        run: ruff check app tests scripts --select F,E9

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
        working-directory: frontend
      # ⚠️ 2026-10-01：此前 frontend job 只有 build，**样式约定没有任何执行点**
      # （`.githooks/pre-commit` 只是本机约定，CI 不读 hooksPath ⇒ 对 CI 无效）。
      # 门禁声明与执行点必须一一对应，故在此显式接入。
      # 位置在 build **之前**：本步是纯文本 grep、耗时 <1s，而 build 含 `tsc -b`
      # 至少数十秒；让「约定违规」这个更廉价、更常见的失败模式先阻断，
      # 既省 CI 时间也让报错指向更准（build 失败常淹没问题根因）。
      - run: npm run style:check
        working-directory: frontend
      # ⚠️ 2026-10-01：`/etf` 与 `/etf/:code` 的侧栏入口曾在 IA 重构中被**静默删除**，
      # 路由却还在 ⇒ 页面变成"只能靠全局搜索或手敲 URL 到达"的孤岛（用户报障）。
      # 与 style:check 同理：**约定不能只写进注释**。本步是纯文本分析、耗时 <1s，
      # 同样放在 build 之前，让更廉价的失败模式先阻断。
      - run: npm run nav:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
