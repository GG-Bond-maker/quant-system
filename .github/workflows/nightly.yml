# AQP Nightly E2E：Redis + FastAPI + Frontend + smoke + ML + backtest
name: Nightly E2E
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - run: pip install -r backend/requirements.txt -q playwright -q
      - run: playwright install chromium

      - name: Bootstrap admin
        working-directory: backend
        run: python scripts/create_admin.py citest citest123

      - name: Start FastAPI
        working-directory: backend
        env:
          SQLITE_URL: "sqlite+aiosqlite:///./data/sqlite/aqp_ci.db"
          DATA_ROOT: "./data/test_parquet"
          REDIS_ENABLED: "true"
        run: |
          nohup python -m uvicorn app.main:app --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/health

      - name: Start Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          nohup npm run dev -- --port 5173 &
          sleep 5

      - name: E2E Smoke
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:5173/
          echo "E2E smoke OK"

      - name: Playwright E2E
        working-directory: backend
        env:
          BASE_URL: "http://127.0.0.1:5173"
        # `|| echo "E2E non-blocking"` 会让**失败也显示为绿色**（整步 exit 0）⇒
        # 夜间 E2E 实际上从不上报问题。改用 `continue-on-error`：作业不因 E2E
        # 失败而红，但该步在 GitHub UI 上**标红并附失败日志**（信号保留）。
        continue-on-error: true
        run: python -m pytest tests/test_e2e.py -v

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: backend/screenshots/
